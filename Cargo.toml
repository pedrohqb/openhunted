[workspace]
members = ["crates/*"]
# Sem a SDL3 instalada, `cargo build`/`cargo test` cobrem formatos, engine e ohtool; o
# visualizador se compila com `-p openhunted` (ver README).
default-members = ["crates/openhunted-formats", "crates/openhunted-engine", "crates/ohtool"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/pedrohqb/openhunted"

[workspace.dependencies]
thiserror = "2.0"
