[package]
name = "ohtool"
description = "Ferramenta de linha de comando para inspecionar e extrair os dados do Hunter Hunted"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
openhunted-formats = { path = "../openhunted-formats", features = ["serde"] }
openhunted-engine = { path = "../openhunted-engine", features = ["audit"] }
serde_json = "1.0"
serde = "1.0"
clap = { version = "4.6", features = ["derive"] }
png = "0.18"

[dev-dependencies]
openhunted-formats = { path = "../openhunted-formats", features = ["serde", "test-support"] }
assert_cmd = "2.2"
tempfile = "3.27"
