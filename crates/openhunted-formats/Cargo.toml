[package]
name = "openhunted-formats"
description = "Leitura dos formatos de dados do Hunter Hunted (1996)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
sha2 = "0.11"
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
test-support = []
serde = ["dep:serde"]

[dev-dependencies]
openhunted-formats = { path = ".", features = ["test-support"] }
tempfile = "3.27"
